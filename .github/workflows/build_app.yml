name: Build For Github
# Build check only. The live site is built and deployed to FriendlyUser.github.io by
# github_repo.yml ("Build Main Site"). This workflow used to deploy the same build to
# this repo's gh-pages branch, which served a duplicate copy of the whole site at
# https://friendlyuser.github.io/astro-tech-blog/ (indexed by Google).
on:
  push:
    branches:
      - feature/*
  pull_request:

jobs:
  make_website:
    name: Generate Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - uses: actions/setup-node@v4
        name: Update node
        with:
          node-version: '22'

      - name: install astro
        run: npm install --force

      - name: build
        run: |
          # node_modules (cached) holds Astro's rendered-content cache; start from fresh content.
          rm -rf node_modules/.astro
          npm run build
